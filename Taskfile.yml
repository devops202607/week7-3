version: "3"

vars:
  CHART_FILE: charts/nginx-app/Chart.yaml

tasks:
  bump:
    desc: "Bump appVersion, commit, tag and push. Usage: task bump -- v1.2.3"
    cmds:
      - |
        VERSION={{.CLI_ARGS}}
        if [ -z "$VERSION" ]; then
          echo "Error: version required. Usage: task bump -- v1.2.3"
          exit 1
        fi
        if ! echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "Error: version must match vMAJOR.MINOR.PATCH (e.g. v1.2.3)"
          exit 1
        fi
        echo "Bumping to $VERSION..."
        sed -i "s/^appVersion:.*$/appVersion: \"$VERSION\"/" {{.CHART_FILE}}
        git add {{.CHART_FILE}}
        git commit -m "chore: bump to $VERSION"
        git tag "$VERSION"
        git push origin main --tags
        echo "Done: pushed tag $VERSION"

  current:
    desc: "Show current appVersion from Chart.yaml"
    cmds:
      - grep '^appVersion:' {{.CHART_FILE}}
